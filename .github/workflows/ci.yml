name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build, vet, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go mod tidy and verify
        run: |
          go mod tidy -diff
          go mod verify
      - run: make fmt-check
      - run: make vet
      - run: make e2e-compile
      - run: make build
      - run: make test
      - run: make test-heavy
      - name: dependency allowlist and licenses
        run: python3 scripts/check_deps.py

  contract:
    name: OpenAPI contract and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make openapi-check
      - run: make generate-check

  vectors:
    name: test vectors (independent reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Python 3.12 has the Unicode 15.0.0 tables (V), so the reference checks
      # the cases tagged with ucd_version too; --require-ucd fails instead of
      # skipping them if another Python is used (TestCIRequiresV).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make vectors-verify-heavy VECTORS_REQUIRE_UCD=15.0.0
      - run: make vectors-crosscheck

  migrations:
    name: migrations and repositories on MySQL 8.0
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mfgraph
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmfgraph --silent"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test-mysql MYSQL_TEST_DSN='root:mfgraph@tcp(127.0.0.1:3306)/'

  migrations-seekdb:
    name: migrations and repositories on seekdb
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      seekdb:
        # MySQL-5.7-compatible single-node database (test image). Keep the tag
        # in sync with deploy/docker-compose.dev.yml (checked by
        # TestSeekdbImagePinned).
        image: oceanbase/seekdb:1.4.0-100000172026082615
        ports:
          - 2881:2881
        options: >-
          --health-cmd "mysql -h127.0.0.1 -P2881 -uroot --connect-timeout=2 -e 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-start-period 60s
          --health-retries 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: wait until seekdb answers queries
        run: |
          # A fresh seekdb initializes its data directory first; if this ever
          # gets flaky, raise the limits instead of removing the job.
          for i in $(seq 1 120); do
            if command -v mysql >/dev/null 2>&1; then
              if mysql -h127.0.0.1 -P2881 -uroot --connect-timeout=2 -e 'SELECT 1' >/dev/null 2>&1; then
                echo "seekdb answers queries (attempt $i)"; exit 0
              fi
            elif (exec 3<>/dev/tcp/127.0.0.1/2881) 2>/dev/null; then
              echo "seekdb port is open (attempt $i); the tests wait for queries"; exit 0
            fi
            sleep 5
          done
          echo "seekdb did not become ready within 10 minutes"; exit 1
      - run: make test-seekdb SEEKDB_TEST_DSN='root@tcp(127.0.0.1:2881)/' SEEKDB_WAIT=600s

  e2e-mysql:
    name: acceptance tests on MySQL 8.0
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mfgraph
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmfgraph --silent"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test-e2e
        env:
          MFGRAPH_E2E_DB_DSN: root:mfgraph@tcp(127.0.0.1:3306)/
          MFGRAPH_E2E_REQUIRE_DB: "1"
      - name: module bundle for linux/amd64
        run: make bundle BUNDLE_PLATFORMS=linux/amd64
      - name: acceptance script of the host module, run from the unpacked bundle
        run: |
          bundle="$RUNNER_TEMP/bundle"
          mkdir -p "$bundle"
          go run ./tools/bundle extract "dist/mfgraph-$(cat packaging/host-module/VERSION)-linux-amd64.tar.zst" "$bundle"
          cd "$bundle"
          SOCK="$RUNNER_TEMP/modules/mfgraph.sock" DATADIR="$RUNNER_TEMP/mfgraph-data" TOKEN=dev-token PREPARE_DB=1 \
          DSN='root:mfgraph@tcp(127.0.0.1:3306)/mfgraph?parseTime=true' \
          OPS_DSN='root:mfgraph@tcp(127.0.0.1:3306)/ops?parseTime=true' \
          MYSQL='mysql -h127.0.0.1 -P3306 -uroot -pmfgraph' \
          scripts/acceptance-m1.0a.sh

  e2e-seekdb:
    name: acceptance tests on seekdb
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      seekdb:
        # Keep the tag in sync with deploy/docker-compose.dev.yml (checked by
        # TestSeekdbImagePinned).
        image: oceanbase/seekdb:1.4.0-100000172026082615
        ports:
          - 2881:2881
        options: >-
          --health-cmd "mysql -h127.0.0.1 -P2881 -uroot --connect-timeout=2 -e 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-start-period 60s
          --health-retries 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: wait until seekdb answers queries
        run: |
          for i in $(seq 1 120); do
            if command -v mysql >/dev/null 2>&1; then
              if mysql -h127.0.0.1 -P2881 -uroot --connect-timeout=2 -e 'SELECT 1' >/dev/null 2>&1; then
                echo "seekdb answers queries (attempt $i)"; exit 0
              fi
            elif (exec 3<>/dev/tcp/127.0.0.1/2881) 2>/dev/null; then
              echo "seekdb port is open (attempt $i); the tests wait for queries"; exit 0
            fi
            sleep 5
          done
          echo "seekdb did not become ready within 10 minutes"; exit 1
      - run: make test-e2e
        env:
          MFGRAPH_E2E_DB_DSN: root@tcp(127.0.0.1:2881)/
          MFGRAPH_E2E_DB_WAIT: 600s
          MFGRAPH_E2E_REQUIRE_DB: "1"

  bundle:
    name: module bundles (reproducible, unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make bundle
      - name: build again from an empty Go build cache and compare
        run: make bundle-check
      - uses: actions/upload-artifact@v4
        with:
          name: mfgraph-module-bundles
          path: dist/
          if-no-files-found: error

  docs:
    name: links, sensitive-data scan, host names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_links.py .
      - run: python3 scripts/scan_sensitive.py .
      - name: the host platform is named only in packaging/host-module
        run: python3 packaging/host-module/check_host_names.py
