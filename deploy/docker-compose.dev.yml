# Development database for MFGraph (MySQL 8.0).
#
#   make dev-db-up      # start and wait until healthy
#   make test-mysql     # run the migration tests against it
#   make dev-db-down    # stop (data is kept in the named volume)
#   make dev-db-reset   # stop and delete the data volume
#
# The credentials below are for a throwaway local container only. The port is
# bound to 127.0.0.1; override it with MFGRAPH_DEV_MYSQL_PORT.
name: mfgraph-dev

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mfgraph
      MYSQL_DATABASE: mfgraph
      MYSQL_USER: mfgraph
      MYSQL_PASSWORD: mfgraph
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    ports:
      - "127.0.0.1:${MFGRAPH_DEV_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmfgraph", "--silent"]
      interval: 3s
      timeout: 5s
      retries: 60
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
